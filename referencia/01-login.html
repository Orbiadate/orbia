<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>body{margin:0;background:#070b16;display:flex;justify-content:center}a{text-decoration:none}</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(160deg,#1b2050 0%,#0d1424 42%);color:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif">
<div style="flex:1;min-height:0;padding:52px 24px 0;display:flex;flex-direction:column;gap:22px">
<div style="display:flex;flex-direction:column;gap:12px">
<span style="align-self:flex-start;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;padding:6px 12px;border-radius:999px">ORBIA AI</span>
<h1 style="margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1">Bienvenido a ORBIA</h1>
<p style="margin:0;font-size:15px;color:#94a3b8;line-height:1.5">Agenda citas en tus locales favoritos, con IA o por tu cuenta.</p>
</div>

<div style="display:flex;flex-direction:column;gap:14px">
<label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:#cbd5e1">Correo
<input type="email" placeholder="tucorreo@ejemplo.com" style="height:52px;box-sizing:border-box;width:100%;padding:0 16px;border-radius:14px;background:#0d1424;border:1px solid rgba(148,163,184,.2);color:#fff;font-family:inherit;font-size:15px">
</label>
<label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:#cbd5e1">Contraseña
<input type="password" placeholder="Tu contraseña" style="height:52px;box-sizing:border-box;width:100%;padding:0 16px;border-radius:14px;background:#0d1424;border:1px solid rgba(148,163,184,.2);color:#fff;font-family:inherit;font-size:15px">
</label>
<a href="01-login.html" style="align-self:flex-end;min-height:44px;display:flex;align-items:center;font-size:13px;font-weight:700;color:#a5b4fc">¿Olvidaste tu contraseña?</a>
</div>

<div style="display:flex;flex-direction:column;gap:14px;margin-top:-14px">
<a href="03-servicios.html" style="height:52px;border-radius:16px;background:linear-gradient(135deg,#6366f1,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700">Iniciar sesión</a>
<div style="display:flex;align-items:center;gap:12px;color:#8b9ab3;font-size:12px;font-weight:600"><span style="flex:1;height:1px;background:rgba(148,163,184,.2)"></span>o<span style="flex:1;height:1px;background:rgba(148,163,184,.2)"></span></div>
<button type="button" style="height:52px;border-radius:16px;background:#1e293b;border:1px solid rgba(148,163,184,.3);color:#fff;font-family:inherit;font-size:15px;font-weight:700">Continuar con Google</button>
<a href="03-servicios.html" style="min-height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#a5b4fc">Continuar como invitado</a>
</div>
</div>

<div style="flex:none;padding:12px 24px 28px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:#94a3b8">¿No tienes cuenta?<a href="02-registro.html" style="min-height:44px;display:flex;align-items:center;font-weight:800;color:#a5b4fc">Crear cuenta</a></div>
</div>
</body>
</html>
