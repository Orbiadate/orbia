<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crear cuenta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>body{margin:0;background:#070b16;display:flex;justify-content:center}a{text-decoration:none}</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(160deg,#1b2050 0%,#0d1424 42%);color:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif">
<div style="flex:1;min-height:0;padding:16px 24px 0;display:flex;flex-direction:column;gap:20px">
<a href="01-login.html" aria-label="Volver a Iniciar sesión" style="width:44px;height:44px;border-radius:50%;background:#1e293b;border:1px solid rgba(148,163,184,.14);display:flex;align-items:center;justify-content:center;color:#fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="display:flex;flex-direction:column;gap:10px">
<h1 style="margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1">Crea tu cuenta</h1>
<p style="margin:0;font-size:15px;color:#94a3b8;line-height:1.5">Guarda tus citas y agéndalas en segundos.</p>
</div>

<div style="display:flex;flex-direction:column;gap:14px">
<label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:#cbd5e1">Nombre
<input type="text" placeholder="Tu nombre" style="height:52px;box-sizing:border-box;width:100%;padding:0 16px;border-radius:14px;background:#0d1424;border:1px solid rgba(148,163,184,.2);color:#fff;font-family:inherit;font-size:15px">
</label>
<label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:#cbd5e1">Correo
<input type="email" placeholder="tucorreo@ejemplo.com" style="height:52px;box-sizing:border-box;width:100%;padding:0 16px;border-radius:14px;background:#0d1424;border:1px solid rgba(148,163,184,.2);color:#fff;font-family:inherit;font-size:15px">
</label>
<label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:#cbd5e1">Contraseña
<input type="password" placeholder="Mínimo 8 caracteres" style="height:52px;box-sizing:border-box;width:100%;padding:0 16px;border-radius:14px;background:#0d1424;border:1px solid rgba(148,163,184,.2);color:#fff;font-family:inherit;font-size:15px">
<span style="font-size:12px;font-weight:500;color:#94a3b8">Usa al menos 8 caracteres.</span>
</label>
<label style="display:flex;align-items:center;gap:12px;min-height:44px;font-size:13px;color:#cbd5e1"><input type="checkbox" style="width:20px;height:20px;accent-color:#7c3aed">Acepto los términos y el aviso de privacidad</label>
</div>

<a href="03-servicios.html" style="height:52px;border-radius:16px;background:linear-gradient(135deg,#6366f1,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700">Crear cuenta</a>
</div>

<div style="flex:none;padding:12px 24px 28px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:#94a3b8">¿Ya tienes cuenta?<a href="01-login.html" style="min-height:44px;display:flex;align-items:center;font-weight:800;color:#a5b4fc">Iniciar sesión</a></div>
</div>
</body>
</html>
